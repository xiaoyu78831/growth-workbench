<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 英语词汇 · 百词斩式学习</title>
<style>
  :root{
    --rose:#F472B6; --rose-dark:#EC4899; --rose-light:#FCE7F3; --rose-soft:#FDF2F8;
    --pink:#F9A8D4; --bg:#FFF0F5; --bg-dots:#FBCFE8; --card:#FFFFFF;
    --text-main:#4A044E; --text-sub:#9D174D; --text-light:#BE185D;
    --border:#FCE7F3; --shadow:0 4px 20px rgba(236,72,153,.08); --shadow-hover:0 8px 30px rgba(236,72,153,.14);
    --green:#86EFAC; --green-light:#DCFCE7; --blue:#93C5FD; --blue-light:#DBEAFE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    color:var(--text-main);
    min-height:100vh;
  }
  .view{display:none;min-height:100vh;}
  .view.active{display:block;}

  /* ---------- 主页 ---------- */
  .home{padding:24px 18px 48px;}
  .brand{text-align:center;margin:14px 0 4px;}
  .logo{width:60px;height:60px;border-radius:20px;margin:0 auto;
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:var(--shadow-hover);}
  .brand h1{font-size:21px;font-weight:800;color:var(--rose-dark);margin:14px 0 4px;}
  .brand p{font-size:12.5px;color:var(--text-light);margin:0;}
  .pwrap{margin:22px 4px 18px;}
  .pbar{height:10px;background:var(--rose-light);border-radius:6px;overflow:hidden;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--rose-dark));border-radius:6px;transition:width .4s;}
  .ptext{text-align:center;font-size:12.5px;color:var(--text-light);margin-top:8px;font-weight:600;}
  .ptext b{color:var(--rose-dark);font-size:14px;}
  .fcards{display:flex;flex-direction:column;gap:14px;}
  .fcard{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px 16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;}
  .fcard:active{transform:scale(.98);box-shadow:var(--shadow-hover);}
  .fcard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;}
  .fcard .meta{flex:1;min-width:0;}
  .fcard .meta .t{font-size:16px;font-weight:700;color:var(--text-main);}
  .fcard .meta .c{font-size:12.5px;color:var(--text-light);margin-top:3px;}
  .fcard .arrow{color:var(--pink);font-size:22px;font-weight:700;flex:0 0 auto;}
  .fcard.start{background:linear-gradient(135deg,var(--rose),var(--rose-dark));border:0;}
  .fcard.start .ic{background:rgba(255,255,255,.22);}
  .fcard.start .meta .t,.fcard.start .meta .c{color:#fff;}
  .fcard.start .arrow{color:#fff;}

  /* ---------- 学习（百词斩卡片） ---------- */
  .learn{display:none;flex-direction:column;padding:14px 14px 22px;min-height:100vh;}
  .learn.active{display:flex;}
  .topbar{display:flex;align-items:center;gap:12px;}
  .back{width:38px;height:38px;border:0;border-radius:12px;background:#fff;color:var(--rose-dark);
    font-size:18px;cursor:pointer;box-shadow:var(--shadow);flex:0 0 auto;}
  .count{font-size:13px;color:var(--text-light);font-weight:600;flex:0 0 auto;}
  .lbar{flex:1;height:8px;background:var(--rose-light);border-radius:6px;overflow:hidden;}
  .lfill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--rose-dark));border-radius:6px;transition:width .35s;}
  .card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0;}
  .flip{position:relative;width:100%;max-width:360px;height:440px;perspective:1400px;cursor:pointer;}
  .face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .55s;border-radius:26px;
    background:#fff;box-shadow:0 16px 40px rgba(236,72,153,.18);display:flex;flex-direction:column;overflow:hidden;}
  .face.back{transform:rotateY(180deg);overflow-y:auto;}
  .flip.flipped .face.front{transform:rotateY(180deg);}
  .flip.flipped .face.back{transform:rotateY(360deg);}
  .imgpanel{position:relative;height:210px;background:var(--rose-soft);overflow:hidden;flex:0 0 auto;}
  .imgpanel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .imgpanel .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:74px;}
  .cat-tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.88);color:var(--rose-dark);
    font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;z-index:2;}
  .spk{position:absolute;top:10px;right:10px;width:38px;height:38px;border:0;border-radius:50%;
    background:rgba(255,255,255,.9);color:var(--rose-dark);font-size:17px;cursor:pointer;z-index:3;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .word{flex:1;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;
    color:var(--rose-dark);text-align:center;padding:0 16px;line-height:1.2;}
  .hint{text-align:center;color:var(--text-light);font-size:12px;padding-bottom:20px;}
  .phon{font-size:16px;color:var(--text-light);text-align:center;padding:0 16px 8px;font-style:italic;letter-spacing:.3px;}
  .zh{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--text-main);padding:20px 18px 6px;text-align:center;}
  .use{padding:0 24px 12px;font-size:14px;color:var(--text-sub);text-align:center;line-height:1.6;}
  .listitem .ph{font-size:11px;color:var(--text-light);font-style:italic;margin-left:6px;}
  .ex{padding:0 24px 22px;font-size:13.5px;color:var(--text-sub);text-align:center;line-height:1.55;}
  .spk-back{position:static;width:auto;height:auto;border-radius:14px;padding:11px 0;margin:0 24px 20px;
    display:flex;justify-content:center;font-size:14px;font-weight:700;box-shadow:none;background:var(--rose-soft);}
  .btns{display:flex;gap:12px;padding:4px 0 8px;}
  .btns button{flex:1;border:0;border-radius:16px;padding:16px 0;font-size:15px;font-weight:700;cursor:pointer;}
  .btns .b-no{background:var(--rose-soft);color:var(--rose-dark);}
  .btns .b-yes{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;box-shadow:var(--shadow-hover);}

  /* ---------- 完成 ---------- */
  .complete{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;}
  .complete.active{display:flex;}
  .complete .big{font-size:64px;margin-bottom:10px;}
  .complete h2{font-size:20px;color:var(--rose-dark);margin:0 0 8px;}
  .complete p{font-size:13.5px;color:var(--text-light);margin:0 0 26px;line-height:1.6;}
  .complete button{border:0;border-radius:16px;padding:14px 36px;font-size:15px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;box-shadow:var(--shadow-hover);}

  /* ---------- 列表 ---------- */
  .list{display:none;flex-direction:column;padding:14px;min-height:100vh;}
  .list.active{display:flex;}
  .lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .lhead .lt{font-size:16px;font-weight:700;color:var(--text-main);}
  .lbox{flex:1;overflow-y:auto;}
  .listitem{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow);}
  .listitem:active{transform:scale(.99);}
  .listitem .en{font-size:16px;font-weight:700;color:var(--text-main);flex:1;min-width:0;}
  .listitem .zh{font-size:12.5px;color:var(--text-light);}
  .listitem .st{font-size:16px;flex:0 0 auto;}
  .listitem.done .en{color:var(--rose-dark);}
  .listitem.done .st{color:var(--green);}
  .empty{text-align:center;color:var(--text-light);padding:60px 0;font-size:14px;line-height:1.6;}
</style>
</head>
<body>

  <!-- ============ 主页 ============ -->
  <div class="view home active" id="home">
    <div class="brand">
      <div class="logo">🔤</div>
      <h1>AI 英语词汇</h1>
      <p>学习 AI 工具 · 翻阅 AI 网页必备</p>
    </div>
    <div class="pwrap">
      <div class="pbar"><div class="pfill" id="hFill"></div></div>
      <div class="ptext">已学 <b id="hDone">0</b> / <span id="hTotal">0</span> · <span id="hPct">0%</span></div>
    </div>
    <div class="fcards">
      <div class="fcard" onclick="showList('done')">
        <div class="ic" style="background:var(--green-light)">✅</div>
        <div class="meta"><div class="t">已完成单词</div><div class="c"><span id="hDone2">0</span> 个已掌握</div></div>
        <div class="arrow">›</div>
      </div>
      <div class="fcard" onclick="showList('todo')">
        <div class="ic" style="background:var(--rose-light)">📚</div>
        <div class="meta"><div class="t">未完成单词</div><div class="c"><span id="hTodo">0</span> 个待学习</div></div>
        <div class="arrow">›</div>
      </div>
      <div class="fcard start" onclick="startLearn()">
        <div class="ic">🚀</div>
        <div class="meta"><div class="t">开始学习</div><div class="c">逐个记忆 · 配图卡片</div></div>
        <div class="arrow">›</div>
      </div>
    </div>
  </div>

  <!-- ============ 学习 ============ -->
  <div class="view learn" id="learn">
    <div class="topbar">
      <button class="back" onclick="goBack()">‹</button>
      <div class="count" id="lCount">第 1 / 1 个</div>
      <div class="lbar"><div class="lfill" id="lFill"></div></div>
    </div>
    <div class="card-area">
      <div class="flip" id="flip" onclick="flipCard()">
        <div class="face front">
          <div class="imgpanel">
            <span class="cat-tag" id="lCat"></span>
            <img id="lImg" src="" onerror="this.style.display='none'">
            <span class="emoji" id="lEmoji">🧠</span>
            <button class="spk" onclick="event.stopPropagation();speak()">🔊</button>
          </div>
          <div class="word" id="lWord"></div>
          <div class="phon" id="lPhon"></div>
          <div class="hint">轻点卡片看释义 ↻</div>
        </div>
        <div class="face back">
          <div class="zh" id="lZh"></div>
          <div class="use" id="lUse"></div>
          <div class="ex" id="lEx"></div>
          <button class="spk spk-back" onclick="event.stopPropagation();speak()">🔊 朗读单词</button>
        </div>
      </div>
    </div>
    <div class="btns">
      <button class="b-no" onclick="markLearn(false)">✗ 还没记住</button>
      <button class="b-yes" onclick="markLearn(true)">✓ 已学会</button>
    </div>
  </div>

  <!-- ============ 完成 ============ -->
  <div class="view complete" id="complete">
    <div class="big">🎉</div>
    <h2>本轮学习完成！</h2>
    <p id="cText">继续加油，AI 词汇越记越牢～</p>
    <button onclick="finishBack()">返回</button>
  </div>

  <!-- ============ 列表 ============ -->
  <div class="view list" id="list">
    <div class="lhead">
      <button class="back" onclick="showView('home')">‹</button>
      <div class="lt" id="lTitle">已完成单词</div>
    </div>
    <div class="lbox" id="lBox"></div>
  </div>

// ---------- 状态 ----------
const LS_KEY = 'xy_vocab_learned_v2';
let learned = new Set();
let sessionQueue = [];
let sessionPos = 0;
let curIndex = -1;
let returnTo = 'home';
let listType = 'done';

function loadLocal(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    learned = new Set(o.learned || []);
  }catch(e){ learned = new Set(); }
}
function saveLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify({learned:[...learned]}));
}
function syncParent(studied){
  try{
    parent.postMessage({ type:'vocab-sync', learned:[...learned], wrong:[], total: VOCAB.length }, '*');
    if(studied){
      const d = new Date();
      const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      parent.postMessage({ type:'vocab-study', date: ds }, '*');
    }
  }catch(e){}
}
function speak(){
  if(!('speechSynthesis' in window) || curIndex < 0) return;
  const u = new SpeechSynthesisUtterance(VOCAB[curIndex][0]);
  u.lang = 'en-US'; u.rate = 0.92;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
}

// ---------- 视图切换 ----------
function showView(name){
  ['home','learn','complete','list'].forEach(v=>{
    document.getElementById(v).classList.toggle('active', v===name);
  });
  if(name==='home') refreshHome();
}

function refreshHome(){
  const total = VOCAB.length;
  const done = learned.size;
  const todo = total - done;
  document.getElementById('hDone').textContent = done;
  document.getElementById('hDone2').textContent = done;
  document.getElementById('hTodo').textContent = todo;
  document.getElementById('hTotal').textContent = total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('hFill').style.width = pct + '%';
  document.getElementById('hPct').textContent = pct + '%';
}

// ---------- 主页 → 学习 ----------
function startLearn(){
  const unlearned = [];
  VOCAB.forEach((v,i)=>{ if(!learned.has(i)) unlearned.push(i); });
  sessionQueue = unlearned.length ? unlearned : VOCAB.map((_,i)=>i);
  sessionPos = 0;
  returnTo = 'home';
  showView('learn');
  renderLearn();
}

function renderLearn(){
  if(sessionPos >= sessionQueue.length){ showComplete(); return; }
  const i = sessionQueue[sessionPos];
  curIndex = i;
  const v = VOCAB[i];
  const cat = CATS[v[2]];
  document.getElementById('lCat').textContent = cat.emoji + ' ' + cat.label;
  document.getElementById('lImg').src = cat.img;
  document.getElementById('lEmoji').textContent = cat.emoji;
  document.getElementById('lWord').textContent = v[0];
  document.getElementById('lPhon').textContent = v[4] ? '/' + v[4] + '/' : '';
  document.getElementById('lZh').textContent = v[1];
  document.getElementById('lUse').textContent = v[5] || '';
  document.getElementById('lEx').textContent = '📌 ' + v[3];
  document.getElementById('flip').classList.remove('flipped');
  document.getElementById('lCount').textContent = '第 ' + (sessionPos+1) + ' / ' + sessionQueue.length + ' 个';
  document.getElementById('lFill').style.width = (sessionPos / sessionQueue.length * 100) + '%';
}

function flipCard(){ document.getElementById('flip').classList.toggle('flipped'); }

function markLearn(isDone){
  if(curIndex < 0) return;
  if(isDone) learned.add(curIndex); else learned.delete(curIndex);
  saveLocal();
  syncParent(isDone);
  sessionPos++;
  renderLearn();
}

function showComplete(){
  const total = VOCAB.length;
  const done = learned.size;
  document.getElementById('cText').textContent =
    '已完成 ' + done + ' / ' + total + ' 个单词' + (done===total ? '，全部搞定啦！🏆' : '，继续冲刺下一轮～');
  showView('complete');
}

function goBack(){
  if(returnTo==='list') showList(listType);
  else showView('home');
}
function finishBack(){
  if(returnTo==='list') showList(listType);
  else showView('home');
}

// ---------- 列表（已完成 / 未完成） ----------
function showList(type){
  listType = type;
  const arr = [];
  VOCAB.forEach((v,i)=>{
    const d = learned.has(i);
    if(type==='done' && d) arr.push(i);
    if(type==='todo' && !d) arr.push(i);
  });
  document.getElementById('lTitle').textContent =
    (type==='done' ? '已完成单词' : '未完成单词') + '（' + arr.length + '）';
  const box = document.getElementById('lBox');
  if(!arr.length){
    box.innerHTML = '<div class="empty">' +
      (type==='done' ? '还没有已学会的单词，去「开始学习」吧 🌟' : '太棒了，所有单词都学完啦 🎉') +
      '</div>';
    showView('list');
    return;
  }
  box.innerHTML = arr.map(i=>{
    const v = VOCAB[i];
    const d = learned.has(i);
    return '<div class="listitem '+(d?'done':'')+'" onclick="openWord('+i+')">'+
      '<div class="en">'+v[0]+'<span class="ph">'+(v[4]?' /'+v[4]+'/':'')+'</span></div><div class="zh">'+v[1]+'</div>'+
      '<div class="st">'+(d?'✓':'○')+'</div></div>';
  }).join('');
  showView('list');
}

function openWord(i){
  sessionQueue = [i];
  sessionPos = 0;
  returnTo = 'list';
  showView('learn');
  renderLearn();
}

// ---------- 启动 + 云同步 ----------
loadLocal();
refreshHome();
syncParent(false);
try{ parent.postMessage({ type:'vocab-request' }, '*'); }catch(e){}
window.addEventListener('message', function(e){
  const d = e.data; if(!d) return;
  if(d.type === 'vocab-load'){
    const before = learned.size;
    (d.learned || []).forEach(x=>learned.add(x));
    saveLocal();
    if(learned.size !== before){ refreshHome(); }
    syncParent(false);
  }
});
</script>
